# Read the Docs build configuration.
# Builds the demo MkDocs site (mkdocs.yml + docs/), installing the package
# so the gitsvg plugin and its dependencies are available at build time.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

mkdocs:
  configuration: mkdocs.yml

python:
  install:
    - method: pip
      path: .
